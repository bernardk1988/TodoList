
{% extends 'base.html' %}

{% block title %}Edit Todo{% endblock %}
  {% block extra_css %}
        <style>
            .todo-heading {
                 color: blue;
                 font-weight: bold;
                }
        </style>
    {% endblock %}

{% block content %}

<div class="card shadow mx-auto" style="max-width: 550px;">

    <div class="card-header bg-warning">
        <h2 class="edit-heading">Edit Todo Task</h2>
        <h4 class="mb-0">Update Task</h4>
    </div>

    <div class="card-body">

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Task Name</label>

                <input type="text"
                       name="task"
                       class="form-control"
                       value="{{ todo.task }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Date & Time</label>

                <input type="datetime-local"
                       name="datetime"
                       class="form-control"
                       value="{{ todo.datetime|date:'Y-m-d\TH:i' }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>

                <select name="status" class="form-select">

                    {% for value, label in todo.STATUS_CHOICES %}
                        <option value="{{ value }}"
                            {% if todo.status == value %}selected{% endif %}>
                            {{ label }}
                        </option>
                    {% endfor %}

                </select>
            </div>

            <button type="submit" class="btn btn-success">
                Update Task
            </button>

            <a href="{% url 'todo_list' %}"
               class="btn btn-secondary">
                Back
            </a>

        </form>

    </div>
</div>

{% endblock %}
